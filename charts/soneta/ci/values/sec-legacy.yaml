secrets:
  - name: afs-secret
    data:
      - key: a
        value: "x"
      - key: b
        value: "1000000"
  - name: empty-secret
    data: []
pvcs:
  - name: extra
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
tolerations:
  - key: dedicated
    operator: Equal
    value: soneta
    effect: NoSchedule
  - key: spot
    operator: Exists
    effect: NoSchedule
    tolerationSeconds: 300
