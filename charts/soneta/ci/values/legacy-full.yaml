# Deprecated list form in every group: duplicate env names, valueFrom, nameless mount, dashboard args.
envs:
  all:
    - name: TZ
      value: Europe/Warsaw
    - name: TZ
      value: UTC
  frontend:
    - name: FRONT
      value: "1"
  backend:
    - name: BACK
      value: "2"
  web:
    - name: WEBSECRET
      valueFrom:
        secretKeyRef:
          name: s
          key: k
  server:
    - name: NUMLIKE
      value: "1000000"
    - name: EMPTY
      value: ""
  admin:
    - name: ADM
      value: x
  scheduler:
    - name: SCH
      value: y
volumes:
  all:
    - name: authentication
      mountPath: /home/app/.config/Soneta/Authentication
      subPath: tokenkey
      spec:
        csi:
          driver: file.csi.azure.com
          volumeAttributes:
            shareName: share
            secretName: afs-secret
    - mountPath: /home/app/nameless
  server:
    - name: scratch
      mountPath: /scratch
      spec:
        emptyDir: {}
args:
  all:
    - --all-arg
  server:
    - --server-arg=1
  web:
    - --web
  dashboard:
    - --otlp
    - "--key=value with spaces"
# Deprecated list form of secrets, pvcs and tolerations.
secrets:
  - name: afs-secret
    data:
      - key: a
        value: "x"
      - key: b
        value: "1000000"
  - name: empty-secret
    data: []
pvcs:
  - name: extra
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
tolerations:
  - key: dedicated
    operator: Equal
    value: soneta
    effect: NoSchedule
  - key: spot
    operator: Exists
    effect: NoSchedule
    tolerationSeconds: 300
