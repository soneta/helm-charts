# yaml-language-server: $schema=./values.schema.json
# Default values for soneta.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

adminMode: false
replicaCount: 1
image:
  product: "standard"
  tag: "2610.0.1"
  webTagPostfix: -alpine
  serverTagPostfix: -alpine
  repository: ""
  scheduler: false
  compiler: false
  webapi: false
  webwcf: false
  dashboard: "mcr.microsoft.com/dotnet/aspire-dashboard:13"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  server:
    type: ClusterIP

appsettings: 
  CommHub:
    GarnetServer:
      MemorySize: "16m"
      IndexSize: "16m"
      PageSize: "4m"
  HealthCheck:
    Enabled: true

ingress:
  enabled: false
  class: traefik
  host: enova365.pl
  # tlsSecretName: soneta-ingress-tls

default-small-component-resources: &default-small-component-resources
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

default-big-component-resources: &default-big-component-resources
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 384Mi

default-special-component-resources: &default-special-component-resources
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

resources:
  pvc:
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 10Mi
  web:
    <<: *default-small-component-resources
  webapi:
    <<: *default-small-component-resources
  webwcf:
    <<: *default-small-component-resources
  orchestrator:
    <<: *default-small-component-resources
  router:
    <<: *default-small-component-resources
  commhub:
    <<: *default-small-component-resources
  dashboard:
    <<: *default-small-component-resources
  server:
    <<: *default-big-component-resources
  scheduler:
    <<: *default-big-component-resources
  compiler:
    <<: *default-special-component-resources
  admin:
    <<: *default-special-component-resources

nodeSelector: []

# Pod tolerations keyed by any id (preferred). A list is still accepted but deprecated.
# No default here: a default table would make Helm ignore a list in an overlay.
# tolerations:
#   dedicated: {key: dedicated, operator: Equal, value: soneta, effect: NoSchedule}

# Kubernetes Opaque secrets keyed by name (preferred). No default.
# secrets:
#   afs-secret:
#     data: {azurestorageaccountname: your_account_name}

# Extra PersistentVolumeClaims keyed by name (preferred). No default.
# pvcs:
#   extra:
#     spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}

affinity: {}

# Environment variables, volumes and startup arguments, per level:
#   all -> frontend|backend -> component (a later level overrides an earlier item with the same key).
# Each level is a map keyed by item name (preferred); a list is still accepted but deprecated.
# A null value deletes the item inherited from an earlier level.
# Keys are sorted within a level, so converting a list to a map can reorder env vars.
envs: {}
  # all:
  #   TZ: Europe/Warsaw          # value
  #   LEGACY_FLAG: null          # deletes LEGACY_FLAG inherited from an earlier level
  # server:
  #   SECRET_KEY:
  #     valueFrom:
  #       secretKeyRef: {name: my-secret, key: key}

volumes: {}
  # all:
  #   authentication:            # volume name (spec present)
  #     mountPath: /home/app/.config/Soneta/Authentication
  #     subPath: tokenkey
  #     spec:
  #       csi: {driver: file.csi.azure.com}
  #   scratch: /scratch          # mount only, on default-pvc

args: {}
  # web:
  #   10-urls: ["--urls", "http://*:8080"]
  # server:
  #   20-verbose: --verbose

healthcheck:
  enabled: true
  all: {}
  frontend: {}
  web: {}
  webapi: {}
  webwcf: {}
  backend: {}
  server: {}
  scheduler: {}
  orchestrator: {}
  router: {}
