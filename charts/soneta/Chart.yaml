annotations:
    artifacthub.io/containsSecurityUpdates: "false"
    artifacthub.io/changes: |
        - "Added compiler component (deployment, pod, values, schema)"
        - "Added optional Aspire Dashboard component (pod, service, OTLP endpoints)"
        - "Added 2Gi memory limit for compiler and admin pods"
        - "Added commhub support in simple mode"
        - "Orchestrator deployment uses Recreate strategy"
        - "Moved dbmgr pause to admin deployment, requires image 2610.0.0 or newer"
        - "Health check parameters in values.yaml"
        - "Optional readiness probe"
        - "Added health check example to README.md"
        - "Default ingress class changed to traefik"
        - "Default image tag changed to 2610.0.1"
        - "Fixed CommHub endpoint: pods hosting CommHub connect via localhost:8082 instead of their own Service"
        - "SONETA_OrchestratorEndpoint set only on orchestrator pods"
