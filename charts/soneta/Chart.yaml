apiVersion: v2
version: 0.7.0-alpha.2
appVersion: ">=2610.0.0"
kubeVersion: ">=1.19.0"
name: soneta
description: Soneta products Helm chart for Kubernetes
keywords: 
    - enova
    - enova365
    - triva
    - soneta
home: https://enova.pl
sources:
    - https://github.com/soneta/helm-charts/tree/main/charts/soneta
    - https://github.com/soneta/helm-charts
maintainers:
    - name: bartcho
    - name: chodakq
#       email:
#       url:
# icon:
annotations:
    artifacthub.io/containsSecurityUpdates: "false"
    artifacthub.io/changes: |
        - "Alpha 0.7.0-alpha.2: secrets, pvcs and tolerations accept maps keyed by name or id (preferred); lists still work but are deprecated"
        - "Alpha 0.7.0-alpha.2: fixed nodeSelector: it is a map (default {}), and pods render only its labels instead of the whole values object (intentional output change, only when nodeSelector is set)"
        - "Alpha 0.7.0-alpha.2: NOTES.txt also warns about deprecated secrets, pvcs and tolerations lists"
        - "Alpha 0.7.0-alpha.1: envs, volumes and args accept maps keyed by item name (preferred); lists still work but are deprecated"
        - "Layered envs, volumes and args: a later level overrides or deletes (null) a single item instead of replacing the whole list"
        - "Fixed schema keys frontend: typo for envs and volumes; added admin, orchestrator, router, commhub levels and args.all"
        - "NOTES.txt warns when deprecated list values are used"
        - "Added compiler component (deployment, pod, values, schema)"
        - "Added optional Aspire Dashboard component (pod, service, OTLP endpoints)"
        - "Added 2Gi memory limit for compiler and admin pods"
        - "Added commhub support in simple mode"
        - "Orchestrator deployment uses Recreate strategy"
        - "Moved dbmgr pause to admin deployment, requires image 2610.0.0 or newer"
        - "Health check parameters in values.yaml"
        - "Optional readiness probe"
        - "Added health check example to README.md"
        - "Default ingress class changed to traefik"
        - "Default image tag changed to 2610.0.1"
        - "Fixed CommHub endpoint: pods hosting CommHub connect via localhost:8082 instead of their own Service"
        - "SONETA_OrchestratorEndpoint set only on orchestrator pods"
