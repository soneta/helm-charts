apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soneta.fullname" (list . "pvc") }}
spec:
  {{- toYaml .Values.resources.pvc.spec | nindent 2 }}

{{- range $pvc := include "soneta.keyed" (list .Values.pvcs "pvcs") | fromYamlArray }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvc.name }}
spec:
  {{- toYaml $pvc.value.spec | nindent 2 }}
{{- end }}