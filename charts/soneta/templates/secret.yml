{{- range $secret := include "soneta.keyed" (list .Values.secrets "secrets") | fromYamlArray }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
type: Opaque
data:
    {{- range $data := include "soneta.secret.data" (list $secret.value.data) | fromYamlArray }}
    {{ $data.name }}: {{ b64enc $data.value }}
    {{- end }}
{{- end }}